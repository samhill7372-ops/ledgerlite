# Keeps the free Supabase project from pausing after 7 idle days.
# Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets.
name: Supabase keep-alive
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null -w "%{http_code}\n"
